{% extends "base.html" %}

{% block content %}
<div class="container-fluid p-0">
  <!-- Dashboard toolbar -->
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
    <div style="font-size:13px;color:var(--text-muted);">Drag widgets to rearrange. Layout saves automatically.</div>
    <div style="display:flex;gap:8px;">
      <button class="av-btn" id="add-widget-btn" onclick="document.getElementById('widget-picker').style.display=document.getElementById('widget-picker').style.display==='none'?'block':'none'">+ Add Widget</button>
      <button class="av-btn" style="color:var(--text-muted);" onclick="resetDashboard()">Reset</button>
    </div>
  </div>

  <!-- Widget picker dropdown -->
  <div id="widget-picker" style="display:none;background:var(--bg-white);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:16px;box-shadow:0 4px 16px rgba(0,0,0,0.08);">
    <div style="font-size:12px;font-weight:600;color:var(--text-muted);text-transform:uppercase;margin-bottom:8px;">Available Widgets</div>
    <div style="display:flex;flex-wrap:wrap;gap:8px;" id="widget-options"></div>
  </div>

  <!-- Dashboard grid -->
  <div class="dash-grid" id="dash-grid"></div>
</div>
{% endblock %}

{% block scriptcontent %}
<script src="{{ url_for('static', filename='assets/js/chart/apex-chart/apex-chart.js') }}"></script>
<script>
(function() {
  var grid = document.getElementById('dash-grid');
  var picker = document.getElementById('widget-options');
  var primaryColor = '#1a56db';

  // Widget registry
  var widgets = {
    welcome: { title: 'Welcome', size: 'dash-w-12', render: function(body) {
      body.style.cssText = 'background:linear-gradient(135deg,#1a56db,#7c3aed,#ec4899);padding:28px;color:#fff;border-radius:0 0 12px 12px;';
      var h = document.createElement('div');
      h.style.cssText = 'font-size:20px;font-weight:700;';
      h.textContent = 'Welcome to D-sec Lab';
      var p = document.createElement('div');
      p.style.cssText = 'font-size:13px;opacity:0.8;margin-top:4px;';
      p.textContent = 'Threat Intelligence Dashboard';
      body.appendChild(h);
      body.appendChild(p);
    }},
    stats: { title: 'Statistics', size: 'dash-w-12', render: function(body) {
      body.style.padding = '0';
      var row = document.createElement('div');
      row.style.cssText = 'display:grid;grid-template-columns:repeat(4,1fr);gap:0;';
      var stats = {{ [
        {'label':'Total Leaks','value':total_leaks|format_number,'color':'#1a56db','bg':'#eff4ff'},
        {'label':consumer_change_text+' Leaks','value':consumer_leaks|format_number,'color':'#d97706','bg':'#fef3c7'},
        {'label':corporate_change_text+' Leaks','value':corporate_leaks|format_number,'color':'#059669','bg':'#ecfdf5'},
        {'label':'Infected IPs','value':infected_ips_count|format_number,'color':'#dc2626','bg':'#fef2f2'}
      ]|tojson }};
      stats.forEach(function(s, i) {
        var cell = document.createElement('div');
        cell.style.cssText = 'padding:20px;' + (i < 3 ? 'border-right:1px solid var(--border-light);' : '');
        cell.textContent = '';
        var val = document.createElement('div');
        val.style.cssText = 'font-size:24px;font-weight:700;letter-spacing:-0.02em;';
        val.textContent = s.value;
        var lbl = document.createElement('div');
        lbl.style.cssText = 'font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:0.05em;color:var(--text-muted);margin-top:4px;';
        lbl.textContent = s.label;
        cell.appendChild(val);
        cell.appendChild(lbl);
        row.appendChild(cell);
      });
      body.appendChild(row);
    }},
    trends: { title: 'Leak Trends', size: 'dash-w-8', render: function(body) {
      var el = document.createElement('div');
      el.id = 'chart-trends-' + Date.now();
      body.appendChild(el);
      new ApexCharts(el, {
        series: [{ name: 'Leaks', data: {{ chart_data|tojson }} }],
        chart: { type:'area', height:260, toolbar:{show:false}, fontFamily:'Inter,sans-serif' },
        colors: [primaryColor], stroke:{curve:'smooth',width:2},
        fill: {type:'gradient',gradient:{shadeIntensity:1,opacityFrom:0.4,opacityTo:0.05}},
        dataLabels:{enabled:false},
        xaxis: {categories:{{ chart_labels|tojson }},labels:{style:{fontSize:'10px',colors:'var(--text-muted)'}}},
        yaxis: {labels:{style:{fontSize:'10px',colors:'var(--text-muted)'},formatter:function(v){return v>=1000?(v/1000).toFixed(0)+'k':Math.floor(v);}}},
        grid:{borderColor:'var(--border-light)',strokeDashArray:3},
        tooltip:{theme:'light'}
      }).render();
    }},
    distribution: { title: 'Source Distribution', size: 'dash-w-4', render: function(body) {
      var el = document.createElement('div');
      el.id = 'chart-dist-' + Date.now();
      body.appendChild(el);
      var catData = {{ category_distribution|tojson }};
      new ApexCharts(el, {
        series: Object.values(catData), chart:{type:'donut',height:240,fontFamily:'Inter,sans-serif'},
        labels: Object.keys(catData), colors:['#1a56db','#0891b2','#d97706','#059669','#dc2626'],
        plotOptions:{pie:{donut:{size:'65%'}}}, legend:{position:'bottom',fontSize:'11px'},
        dataLabels:{enabled:true,formatter:function(v){return Math.round(v)+'%';},style:{fontSize:'10px'}}
      }).render();
    }},
    events: { title: 'Latest Events', size: 'dash-w-12', render: function(body) {
      body.style.padding = '0';
      var tbl = document.createElement('table');
      tbl.className = 'av-table';
      tbl.style.tableLayout = 'fixed';
      var theadRow = document.createElement('thead');
      var tr0 = document.createElement('tr');
      var cols = [
        {text:'Username',style:'padding-left:16px;width:25%'},
        {text:'Domain',style:'width:15%'},
        {text:'Source',style:'width:20%'},
        {text:'Type',style:'width:10%',cls:'c'},
        {text:'Date',style:'width:10%'},
        {text:'',style:'width:50px'}
      ];
      cols.forEach(function(c) {
        var th = document.createElement('th');
        th.style.cssText = c.style;
        th.textContent = c.text;
        if (c.cls) th.className = c.cls;
        tr0.appendChild(th);
      });
      theadRow.appendChild(tr0);
      tbl.appendChild(theadRow);
      var tb = document.createElement('tbody');
      {% for event in latest_events %}
      (function() {
        var tr = document.createElement('tr');
        var td1 = document.createElement('td');
        td1.style.cssText = 'padding-left:16px;font-weight:500';
        td1.textContent = {{ (event.username or "\u2014")|tojson }};
        var td2 = document.createElement('td');
        var sp2 = document.createElement('span');
        sp2.className = 'av-domain';
        sp2.textContent = {{ (event.domain or "\u2014")|tojson }};
        td2.appendChild(sp2);
        var td3 = document.createElement('td');
        td3.className = 'm';
        td3.textContent = {{ (event.source or "\u2014")|tojson }};
        var td4 = document.createElement('td');
        td4.className = 'c';
        var sp4 = document.createElement('span');
        sp4.className = 'av-tag av-tag-blue';
        sp4.textContent = {{ (event.type or "\u2014")|tojson }};
        td4.appendChild(sp4);
        var td5 = document.createElement('td');
        td5.className = 'm';
        td5.textContent = {{ (event.created_at.strftime("%b %d") if event.created_at else "\u2014")|tojson }};
        var td6 = document.createElement('td');
        var a6 = document.createElement('a');
        a6.href = '/threat-intelligence/breached-creds/' + {{ event.es_id|tojson }};
        a6.className = 'av-view-link';
        a6.textContent = 'View';
        td6.appendChild(a6);
        tr.appendChild(td1);
        tr.appendChild(td2);
        tr.appendChild(td3);
        tr.appendChild(td4);
        tr.appendChild(td5);
        tr.appendChild(td6);
        tb.appendChild(tr);
      })();
      {% endfor %}
      {% if not latest_events %}
      var emptyTr = document.createElement('tr');
      var emptyTd = document.createElement('td');
      emptyTd.setAttribute('colspan', '6');
      emptyTd.style.cssText = 'text-align:center;padding:30px;color:var(--text-muted)';
      emptyTd.textContent = 'No events';
      emptyTr.appendChild(emptyTd);
      tb.appendChild(emptyTr);
      {% endif %}
      tbl.appendChild(tb);
      body.appendChild(tbl);
    }},
    type_chart: { title: 'Type Distribution', size: 'dash-w-6', render: function(body) {
      var el = document.createElement('div');
      el.id = 'chart-type-' + Date.now();
      body.appendChild(el);
      var typeData = {{ type_chart_data|tojson }};
      var labels = Object.keys(typeData).map(function(l){return l.charAt(0).toUpperCase()+l.slice(1);});
      new ApexCharts(el, {
        series:[{name:'Leaks',data:Object.values(typeData)}],
        chart:{type:'bar',height:220,toolbar:{show:false},fontFamily:'Inter,sans-serif'},
        colors:[primaryColor], plotOptions:{bar:{borderRadius:4,columnWidth:'50%'}},
        dataLabels:{enabled:false},
        xaxis:{categories:labels,labels:{style:{fontSize:'11px',colors:'var(--text-muted)'}}},
        yaxis:{labels:{style:{fontSize:'10px',colors:'var(--text-muted)'}}},
        grid:{borderColor:'var(--border-light)',strokeDashArray:3}
      }).render();
    }},
  };

  // Default layout
  var defaultLayout = ['welcome','stats','trends','distribution','events'];

  function getLayout() {
    try {
      var saved = localStorage.getItem('dsec-dashboard-layout');
      if (saved) return JSON.parse(saved);
    } catch(e) {}
    return defaultLayout.slice();
  }

  function saveLayout() {
    var ids = [];
    grid.querySelectorAll('.dash-widget').forEach(function(w) { ids.push(w.getAttribute('data-widget')); });
    localStorage.setItem('dsec-dashboard-layout', JSON.stringify(ids));
  }

  function createWidget(id) {
    var cfg = widgets[id];
    if (!cfg) return null;
    var w = document.createElement('div');
    w.className = 'dash-widget ' + cfg.size;
    w.setAttribute('data-widget', id);
    w.draggable = true;

    var header = document.createElement('div');
    header.className = 'dash-widget-header';
    var titleSpan = document.createElement('span');
    titleSpan.textContent = cfg.title;
    var controls = document.createElement('div');
    controls.style.cssText = 'display:flex;align-items:center;gap:4px;';
    var dragHandle = document.createElement('span');
    dragHandle.className = 'dash-drag-handle';
    dragHandle.textContent = '\u2261';
    var closeBtn = document.createElement('button');
    closeBtn.className = 'dash-widget-close';
    closeBtn.textContent = '\u00d7';
    closeBtn.addEventListener('click', function() { w.remove(); saveLayout(); updatePicker(); });
    controls.appendChild(dragHandle);
    controls.appendChild(closeBtn);
    header.appendChild(titleSpan);
    header.appendChild(controls);

    var body = document.createElement('div');
    body.className = 'dash-widget-body';
    cfg.render(body);

    w.appendChild(header);
    w.appendChild(body);

    // Drag events
    w.addEventListener('dragstart', function(e) {
      w.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', id);
    });
    w.addEventListener('dragend', function() {
      w.classList.remove('dragging');
      grid.querySelectorAll('.dash-placeholder').forEach(function(p) { p.remove(); });
      saveLayout();
    });

    return w;
  }

  function renderDashboard() {
    grid.textContent = '';
    var layout = getLayout();
    layout.forEach(function(id) {
      var w = createWidget(id);
      if (w) grid.appendChild(w);
    });
    updatePicker();
    setupDragDrop();
  }

  function updatePicker() {
    picker.textContent = '';
    var current = getLayout();
    Object.keys(widgets).forEach(function(id) {
      if (current.indexOf(id) === -1) {
        var btn = document.createElement('button');
        btn.style.cssText = 'padding:6px 14px;font-size:12px;font-weight:500;border:1px solid var(--border);border-radius:6px;background:var(--bg-white);color:var(--text);cursor:pointer;transition:all 0.15s;';
        btn.textContent = '+ ' + widgets[id].title;
        btn.addEventListener('click', function() {
          var w = createWidget(id);
          if (w) { grid.appendChild(w); saveLayout(); updatePicker(); setupDragDrop(); }
        });
        btn.addEventListener('mouseover', function() { this.style.borderColor='var(--primary)'; this.style.color='var(--primary)'; });
        btn.addEventListener('mouseout', function() { this.style.borderColor='var(--border)'; this.style.color='var(--text)'; });
        picker.appendChild(btn);
      }
    });
    if (!picker.children.length) {
      var msg = document.createElement('span');
      msg.style.cssText = 'font-size:12px;color:var(--text-muted);';
      msg.textContent = 'All widgets are on the dashboard';
      picker.appendChild(msg);
    }
  }

  function setupDragDrop() {
    grid.addEventListener('dragover', function(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      var dragging = grid.querySelector('.dragging');
      var afterEl = getDragAfterElement(grid, e.clientY);
      if (afterEl) {
        grid.insertBefore(dragging, afterEl);
      } else {
        grid.appendChild(dragging);
      }
    });
  }

  function getDragAfterElement(container, y) {
    var elements = Array.from(container.querySelectorAll('.dash-widget:not(.dragging)'));
    return elements.reduce(function(closest, child) {
      var box = child.getBoundingClientRect();
      var offset = y - box.top - box.height / 2;
      if (offset < 0 && offset > closest.offset) {
        return { offset: offset, element: child };
      }
      return closest;
    }, { offset: Number.NEGATIVE_INFINITY }).element;
  }

  window.resetDashboard = function() {
    localStorage.removeItem('dsec-dashboard-layout');
    renderDashboard();
    if (typeof showToast === 'function') showToast('Dashboard reset to default', 'info');
  };

  // Init
  renderDashboard();
  if (typeof feather !== 'undefined') feather.replace();
})();
</script>
{% endblock %}
