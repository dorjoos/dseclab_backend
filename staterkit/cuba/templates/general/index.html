{% extends "base.html" %}

{% block css %}
<style>
  .dash-toolbar { display:flex;justify-content:space-between;align-items:center;margin-bottom:16px; }
  .dash-toolbar-hint { font-size:12px;color:var(--text-muted); }
  .dash-toolbar-actions { display:flex;gap:6px; }
  .dash-customize-btn { font-size:12px;font-weight:500;color:var(--text-secondary);background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:5px 12px;cursor:pointer;transition:all 0.15s; }
  .dash-customize-btn:hover { border-color:var(--primary);color:var(--primary); }

  /* Stat card enhancements */
  .stat-cell { padding:20px;position:relative;overflow:hidden; }
  .stat-cell .stat-bg-svg { position:absolute;top:-10px;right:-10px;width:100px;height:100px;opacity:0.07;pointer-events:none; }
  .stat-icon { width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:12px; }
  .stat-val { font-size:28px;font-weight:800;letter-spacing:-0.03em;line-height:1;position:relative;z-index:1; }
  .stat-label { font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-muted);margin-top:6px;position:relative;z-index:1; }

  /* Welcome widget */
  .welcome-body { position:relative;overflow:hidden; }
  .welcome-body::before { content:'';position:absolute;top:-30%;right:-5%;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,0.08); }
  .welcome-body::after { content:'';position:absolute;bottom:-40%;right:15%;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,0.05); }
  .welcome-title { font-size:22px;font-weight:800;position:relative;z-index:1; }
  .welcome-sub { font-size:14px;opacity:0.85;margin-top:6px;position:relative;z-index:1; }
  .welcome-meta { display:flex;gap:20px;margin-top:16px;position:relative;z-index:1; }
  .welcome-meta-item { font-size:12px;opacity:0.7; }
  .welcome-meta-val { font-weight:700;font-size:14px;opacity:1; }
</style>
{% endblock %}

{% block content %}
<div class="container-fluid p-0">
  <!-- Toolbar -->
  <div class="dash-toolbar">
    <div class="dash-toolbar-hint">
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px;margin-right:4px;"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
      Drag to rearrange &middot; Layout auto-saves
    </div>
    <div class="dash-toolbar-actions">
      <button class="dash-customize-btn" onclick="document.getElementById('widget-picker').style.display=document.getElementById('widget-picker').style.display==='none'?'block':'none'">+ Add Widget</button>
      <button class="dash-customize-btn" onclick="resetDashboard()">Reset</button>
    </div>
  </div>

  <!-- Widget picker -->
  <div id="widget-picker" style="display:none;background:var(--bg-white);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:16px;box-shadow:0 4px 16px rgba(0,0,0,0.08);">
    <div style="font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:10px;">Available Widgets</div>
    <div style="display:flex;flex-wrap:wrap;gap:8px;" id="widget-options"></div>
  </div>

  <!-- Grid -->
  <div class="dash-grid" id="dash-grid"></div>
</div>
{% endblock %}

{% block scriptcontent %}
<script src="{{ url_for('static', filename='assets/js/chart/apex-chart/apex-chart.js') }}"></script>
<script>
(function() {
  var grid = document.getElementById('dash-grid');
  var picker = document.getElementById('widget-options');

  var widgets = {
    welcome: { title: 'Welcome', size: 'dash-w-12', noHeader: true, render: function(body) {
      body.className = 'welcome-body';
      body.style.cssText = 'background:linear-gradient(135deg,#1a56db 0%,#4f46e5 40%,#7c3aed 70%,#a855f7 100%);padding:32px;color:#fff;border-radius:12px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:20px;';
      body.insertAdjacentHTML('beforeend',
        '<div style="position:relative;z-index:1;">' +
          '<div class="welcome-title">Welcome back, {{ current_user.username }}</div>' +
          '<div class="welcome-sub">Threat Intelligence Dashboard &mdash; D-sec Lab</div>' +
        '</div>' +
        '<div style="display:flex;gap:32px;position:relative;z-index:1;">' +
          '<div style="text-align:center;">' +
            '<div style="font-size:36px;font-weight:800;letter-spacing:-0.03em;line-height:1;">{{ total_leaks|format_number }}</div>' +
            '<div style="font-size:12px;opacity:0.7;margin-top:6px;text-transform:uppercase;letter-spacing:0.06em;">Total Records</div>' +
          '</div>' +
          '<div style="width:1px;background:rgba(255,255,255,0.2);"></div>' +
          '<div style="text-align:center;">' +
            '<div style="font-size:36px;font-weight:800;letter-spacing:-0.03em;line-height:1;">{{ latest_events|length }}</div>' +
            '<div style="font-size:12px;opacity:0.7;margin-top:6px;text-transform:uppercase;letter-spacing:0.06em;">Recent Events</div>' +
          '</div>' +
          '<div style="width:1px;background:rgba(255,255,255,0.2);"></div>' +
          '<div style="text-align:center;">' +
            '<div style="font-size:36px;font-weight:800;letter-spacing:-0.03em;line-height:1;">{{ (category_distribution|length) }}</div>' +
            '<div style="font-size:12px;opacity:0.7;margin-top:6px;text-transform:uppercase;letter-spacing:0.06em;">Sources</div>' +
          '</div>' +
        '</div>'
      );
    }},

    stats: { title: 'Key Metrics', size: 'dash-w-12', render: function(body) {
      body.style.padding = '0';
      var stats = {{ [
        {'label':'Total Leaks','value':total_leaks|format_number,'color':'#1a56db','bg':'#eff4ff'},
        {'label':consumer_change_text+' Leaks','value':consumer_leaks|format_number,'color':'#d97706','bg':'#fef3c7'},
        {'label':corporate_change_text+' Leaks','value':corporate_leaks|format_number,'color':'#059669','bg':'#ecfdf5'},
        {'label':'Infected IPs','value':infected_ips_count|format_number,'color':'#dc2626','bg':'#fef2f2'}
      ]|tojson }};
      var svgBgs = [
        '<svg class="stat-bg-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><circle cx="50" cy="50" r="45" fill="none" stroke="#1a56db" stroke-width="3"/><circle cx="50" cy="50" r="30" fill="none" stroke="#1a56db" stroke-width="2"/><circle cx="50" cy="50" r="15" fill="#1a56db" opacity="0.3"/><path d="M50 5 L50 95 M5 50 L95 50" stroke="#1a56db" stroke-width="1" opacity="0.3"/></svg>',
        '<svg class="stat-bg-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><polygon points="50,5 95,30 95,70 50,95 5,70 5,30" fill="none" stroke="#d97706" stroke-width="2.5"/><polygon points="50,20 80,37 80,63 50,80 20,63 20,37" fill="#d97706" opacity="0.15"/><circle cx="50" cy="50" r="8" fill="#d97706" opacity="0.4"/></svg>',
        '<svg class="stat-bg-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><rect x="10" y="10" width="80" height="80" rx="12" fill="none" stroke="#059669" stroke-width="2.5"/><rect x="25" y="25" width="50" height="50" rx="8" fill="#059669" opacity="0.12"/><line x1="10" y1="50" x2="90" y2="50" stroke="#059669" stroke-width="1.5" opacity="0.3"/><line x1="50" y1="10" x2="50" y2="90" stroke="#059669" stroke-width="1.5" opacity="0.3"/><circle cx="50" cy="50" r="6" fill="#059669" opacity="0.4"/></svg>',
        '<svg class="stat-bg-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><path d="M50 5 L95 50 L50 95 L5 50 Z" fill="none" stroke="#dc2626" stroke-width="2.5"/><path d="M50 25 L75 50 L50 75 L25 50 Z" fill="#dc2626" opacity="0.12"/><circle cx="50" cy="50" r="10" fill="none" stroke="#dc2626" stroke-width="2"/><circle cx="50" cy="50" r="4" fill="#dc2626" opacity="0.5"/></svg>'
      ];
      var svgIcons = [
        '<svg style="color:#1a56db;width:20px;height:20px;" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>',
        '<svg style="color:#d97706;width:20px;height:20px;" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
        '<svg style="color:#059669;width:20px;height:20px;" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>',
        '<svg style="color:#dc2626;width:20px;height:20px;" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/></svg>'
      ];
      body.style.padding = '0';
      var row = document.createElement('div');
      row.style.cssText = 'display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:16px;';
      stats.forEach(function(s, i) {
        var cell = document.createElement('div');
        cell.className = 'stat-cell';
        cell.style.cssText = 'background:' + s.bg + ';border-radius:12px;padding:20px;position:relative;overflow:hidden;';
        cell.insertAdjacentHTML('beforeend',
          svgBgs[i] +
          '<div class="stat-icon" style="background:rgba(255,255,255,0.7);backdrop-filter:blur(4px);">' + svgIcons[i] + '</div>' +
          '<div class="stat-val" style="color:' + s.color + ';">' + s.value + '</div>' +
          '<div class="stat-label">' + s.label + '</div>'
        );
        row.appendChild(cell);
      });
      body.appendChild(row);
    }},

    trends: { title: 'Leak Trends', size: 'dash-w-8', subtitle: 'Last 12 weeks', render: function(body) {
      var el = document.createElement('div');
      body.appendChild(el);
      new ApexCharts(el, {
        series: [{ name: 'Leaks', data: {{ chart_data|tojson }} }],
        chart: { type:'area', height:280, toolbar:{show:false}, fontFamily:'Inter,sans-serif' },
        colors: ['#4f46e5'],
        stroke: { curve:'smooth', width:2.5 },
        fill: { type:'gradient', gradient:{ shadeIntensity:1, opacityFrom:0.45, opacityTo:0.02, colorStops:[{offset:0,color:'#4f46e5',opacity:0.4},{offset:100,color:'#a855f7',opacity:0.02}] }},
        dataLabels: { enabled:false },
        xaxis: { categories:{{ chart_labels|tojson }}, labels:{style:{fontSize:'10px',colors:'var(--text-muted)'}}, axisBorder:{show:false}, axisTicks:{show:false} },
        yaxis: { labels:{style:{fontSize:'10px',colors:'var(--text-muted)'}, formatter:function(v){return v>=1000?(v/1000).toFixed(0)+'k':Math.floor(v);}} },
        grid: { borderColor:'var(--border-light)', strokeDashArray:3, xaxis:{lines:{show:false}} },
        tooltip: { theme:'light', y:{formatter:function(v){return v.toLocaleString()+' breaches'}} }
      }).render();
    }},

    distribution: { title: 'Source Distribution', size: 'dash-w-4', render: function(body) {
      var el = document.createElement('div');
      body.appendChild(el);
      var catData = {{ category_distribution|tojson }};
      new ApexCharts(el, {
        series: Object.values(catData),
        chart: { type:'donut', height:260, fontFamily:'Inter,sans-serif' },
        labels: Object.keys(catData),
        colors: ['#4f46e5','#0891b2','#d97706','#059669','#dc2626','#ec4899'],
        plotOptions: { pie:{donut:{size:'62%', labels:{show:true, total:{show:true,label:'Total',fontSize:'11px',fontWeight:500,color:'var(--text-muted)',formatter:function(w){return w.globals.seriesTotals.reduce(function(a,b){return a+b},0).toLocaleString();}},value:{fontSize:'18px',fontWeight:700,color:'var(--text)'}}}} },
        legend: { position:'bottom', fontSize:'11px', markers:{width:8,height:8,radius:2} },
        dataLabels: { enabled:false },
        stroke: { width:2, colors:['var(--bg-white)'] }
      }).render();
    }},

    events: { title: 'Latest Events', size: 'dash-w-12', action: {text:'View All \u2192', href:'/threat-intelligence/breached-creds'}, render: function(body) {
      body.style.cssText = 'padding:16px 20px 16px 40px;position:relative;';
      var colors = {'url':'#4f46e5','stealer':'#dc2626','malware':'#d97706','combolist':'#059669','breach':'#0891b2'};

      // Vertical timeline line
      var line = document.createElement('div');
      line.style.cssText = 'position:absolute;left:30px;top:20px;bottom:20px;width:2px;background:linear-gradient(180deg,var(--primary) 0%,#a855f7 50%,#ec4899 100%);border-radius:1px;opacity:0.3;';
      body.appendChild(line);

      {% for event in latest_events %}
      (function(){
        var type = {{ (event.type or "url")|tojson }};
        var color = colors[type] || '#4f46e5';
        var isLast = {{ loop.last|tojson }};

        // Timeline item
        var item = document.createElement('a');
        item.href = '/threat-intelligence/breached-creds/' + {{ event.es_id|tojson }};
        item.style.cssText = 'display:flex;gap:16px;text-decoration:none;color:var(--text);position:relative;padding:10px 0;' + (isLast ? '' : 'margin-bottom:4px;');
        item.addEventListener('mouseover', function(){ card.style.borderColor=color; card.style.boxShadow='0 2px 12px '+color+'15'; });
        item.addEventListener('mouseout', function(){ card.style.borderColor='var(--border)'; card.style.boxShadow='none'; });

        // Dot on timeline
        var dotWrap = document.createElement('div');
        dotWrap.style.cssText = 'position:relative;flex-shrink:0;width:20px;display:flex;justify-content:center;padding-top:14px;';
        var dot = document.createElement('div');
        dot.style.cssText = 'width:10px;height:10px;border-radius:50%;background:' + color + ';border:2px solid var(--bg-white);box-shadow:0 0 0 2px ' + color + '30;z-index:1;';
        dotWrap.appendChild(dot);
        item.appendChild(dotWrap);

        // Card
        var card = document.createElement('div');
        card.style.cssText = 'flex:1;background:var(--bg-white);border:1px solid var(--border);border-radius:10px;padding:14px 16px;transition:all 0.2s;';

        // Top row: username + domain + date
        var top = document.createElement('div');
        top.style.cssText = 'display:flex;align-items:center;justify-content:space-between;gap:8px;';
        var left = document.createElement('div');
        left.style.cssText = 'display:flex;align-items:center;gap:8px;min-width:0;';
        var un = document.createElement('span');
        un.style.cssText = 'font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;';
        un.textContent = {{ (event.username or "\u2014")|tojson }};
        left.appendChild(un);
        var dm = {{ (event.domain or "")|tojson }};
        if (dm) {
          var dmEl = document.createElement('span');
          dmEl.style.cssText = 'font-size:12px;color:var(--primary);font-weight:500;background:var(--primary-50);padding:2px 6px;border-radius:4px;flex-shrink:0;';
          dmEl.textContent = dm;
          left.appendChild(dmEl);
        }
        var right = document.createElement('div');
        right.style.cssText = 'display:flex;align-items:center;gap:8px;flex-shrink:0;';
        var typeTag = document.createElement('span');
        typeTag.style.cssText = 'font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:' + color + ';';
        typeTag.textContent = type;
        var dateEl = document.createElement('span');
        dateEl.style.cssText = 'font-size:11px;color:var(--text-secondary);font-weight:500;';
        dateEl.textContent = {{ (event.created_at.strftime("%b %d") if event.created_at else "\u2014")|tojson }};
        right.appendChild(typeTag);
        right.appendChild(dateEl);
        top.appendChild(left);
        top.appendChild(right);
        card.appendChild(top);

        // Source inline with top row
        var srcTag = document.createElement('span');
        srcTag.style.cssText = 'font-size:11px;color:var(--text-secondary);font-weight:500;background:var(--bg);padding:2px 6px;border-radius:4px;';
        srcTag.textContent = {{ (event.source or "\u2014")|tojson }};
        right.insertBefore(srcTag, typeTag);

        item.appendChild(card);
        body.appendChild(item);
      })();
      {% endfor %}
      {% if not latest_events %}
      var empty = document.createElement('div');
      empty.style.cssText = 'text-align:center;padding:48px 20px;color:var(--text-muted);font-size:14px;';
      empty.textContent = 'No events yet';
      body.appendChild(empty);
      {% endif %}
    }},

    report_activity: { title: 'Report Activity', size: 'dash-w-6', render: function(body) {
      body.style.cssText = 'display:flex;flex-direction:column;gap:12px;';
      var items = [
        {label:'Scheduled Reports', val:'Active', color:'#059669', bg:'#ecfdf5'},
        {label:'Alert Rules', val:'Monitoring', color:'#dc2626', bg:'#fef2f2'},
        {label:'Last Generated', val:'Recently', color:'#4f46e5', bg:'#eff4ff'},
      ];
      items.forEach(function(item) {
        var row = document.createElement('div');
        row.style.cssText = 'display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--border);border-radius:8px;transition:all 0.15s;';
        row.addEventListener('mouseover',function(){this.style.borderColor=item.color;});
        row.addEventListener('mouseout',function(){this.style.borderColor='var(--border)';});
        var dot = document.createElement('div');
        dot.style.cssText = 'width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:'+item.bg+';flex-shrink:0;';
        var dotInner = document.createElement('div');
        dotInner.style.cssText = 'width:8px;height:8px;border-radius:50%;background:'+item.color+';';
        dot.appendChild(dotInner);
        var info = document.createElement('div');
        info.style.flex = '1';
        var lbl = document.createElement('div');
        lbl.style.cssText = 'font-size:13px;font-weight:500;';
        lbl.textContent = item.label;
        var val = document.createElement('div');
        val.style.cssText = 'font-size:11px;color:var(--text-secondary);';
        val.textContent = item.val;
        info.appendChild(lbl);
        info.appendChild(val);
        row.appendChild(dot);
        row.appendChild(info);
        body.appendChild(row);
      });
      var link = document.createElement('a');
      link.href = '/threat-intelligence/reports';
      link.className = 'av-view-link';
      link.style.cssText = 'font-size:12px;text-align:center;display:block;padding-top:4px;';
      link.textContent = 'Open Reports Hub \u2192';
      body.appendChild(link);
    }},

    type_chart: { title: 'Type Distribution', size: 'dash-w-6', render: function(body) {
      var el = document.createElement('div');
      body.appendChild(el);
      var typeData = {{ type_chart_data|tojson }};
      new ApexCharts(el, {
        series:[{name:'Leaks',data:Object.values(typeData)}],
        chart:{type:'bar',height:240,toolbar:{show:false},fontFamily:'Inter,sans-serif'},
        colors:['#4f46e5'],
        plotOptions:{bar:{borderRadius:6,columnWidth:'55%',distributed:false}},
        fill:{type:'gradient',gradient:{shade:'light',type:'vertical',shadeIntensity:0.2,opacityFrom:1,opacityTo:0.85}},
        dataLabels:{enabled:false},
        xaxis:{categories:Object.keys(typeData).map(function(l){return l.charAt(0).toUpperCase()+l.slice(1)}),labels:{style:{fontSize:'11px',colors:'var(--text-muted)'}}},
        yaxis:{labels:{style:{fontSize:'10px',colors:'var(--text-muted)'}}},
        grid:{borderColor:'var(--border-light)',strokeDashArray:3}
      }).render();
    }},
  };

  var defaultLayout = ['welcome','stats','trends','distribution','events'];

  function getLayout() {
    try { var s = localStorage.getItem('dsec-dashboard-layout'); if (s) return JSON.parse(s); } catch(e) {}
    return defaultLayout.slice();
  }

  function saveLayout() {
    var ids = [];
    grid.querySelectorAll('.dash-widget').forEach(function(w) { ids.push(w.getAttribute('data-widget')); });
    localStorage.setItem('dsec-dashboard-layout', JSON.stringify(ids));
  }

  function createWidget(id) {
    var cfg = widgets[id];
    if (!cfg) return null;
    var w = document.createElement('div');
    w.className = 'dash-widget ' + cfg.size;
    w.setAttribute('data-widget', id);
    w.draggable = true;

    if (!cfg.noHeader) {
      var header = document.createElement('div');
      header.className = 'dash-widget-header';
      var left = document.createElement('div');
      left.style.cssText = 'display:flex;align-items:center;gap:8px;';
      var dragHandle = document.createElement('span');
      dragHandle.className = 'dash-drag-handle';
      dragHandle.textContent = '\u2261';
      var titleSpan = document.createElement('span');
      titleSpan.textContent = cfg.title;
      left.appendChild(dragHandle);
      left.appendChild(titleSpan);
      if (cfg.subtitle) {
        var sub = document.createElement('span');
        sub.style.cssText = 'font-size:11px;font-weight:400;color:var(--text-muted);margin-left:6px;';
        sub.textContent = cfg.subtitle;
        left.appendChild(sub);
      }
      var right = document.createElement('div');
      right.style.cssText = 'display:flex;align-items:center;gap:6px;';
      if (cfg.action) {
        var actLink = document.createElement('a');
        actLink.href = cfg.action.href;
        actLink.className = 'av-view-link';
        actLink.style.fontSize = '12px';
        actLink.textContent = cfg.action.text;
        right.appendChild(actLink);
      }
      var closeBtn = document.createElement('button');
      closeBtn.className = 'dash-widget-close';
      closeBtn.textContent = '\u00d7';
      closeBtn.addEventListener('click', function() { w.remove(); saveLayout(); updatePicker(); });
      right.appendChild(closeBtn);
      header.appendChild(left);
      header.appendChild(right);
      w.appendChild(header);
    }

    var body = document.createElement('div');
    if (!cfg.noHeader) body.className = 'dash-widget-body';
    // Store render function — will be called AFTER widget is in DOM
    w._renderBody = function() { cfg.render(body); };
    w.appendChild(body);

    w.addEventListener('dragstart', function(e) { w.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain',id); });
    w.addEventListener('dragend', function() { w.classList.remove('dragging'); saveLayout(); });
    return w;
  }

  function renderDashboard() {
    grid.textContent = '';
    var widgetEls = [];
    getLayout().forEach(function(id) {
      var w = createWidget(id);
      if (w) { grid.appendChild(w); widgetEls.push(w); }
    });
    // Render charts after all widgets are in DOM (so they have correct width)
    requestAnimationFrame(function() {
      widgetEls.forEach(function(w) { if (w._renderBody) { w._renderBody(); delete w._renderBody; } });
    });
    updatePicker();
    setupDragDrop();
  }

  function updatePicker() {
    picker.textContent = '';
    var current = getLayout();
    Object.keys(widgets).forEach(function(id) {
      if (current.indexOf(id) === -1) {
        var btn = document.createElement('button');
        btn.className = 'dash-customize-btn';
        btn.textContent = '+ ' + widgets[id].title;
        btn.addEventListener('click', function() { var w=createWidget(id); if(w){grid.appendChild(w);requestAnimationFrame(function(){if(w._renderBody){w._renderBody();delete w._renderBody;}});saveLayout();updatePicker();setupDragDrop();} });
        picker.appendChild(btn);
      }
    });
    if (!picker.children.length) {
      var msg = document.createElement('span');
      msg.style.cssText = 'font-size:12px;color:var(--text-muted);';
      msg.textContent = 'All widgets added';
      picker.appendChild(msg);
    }
  }

  function setupDragDrop() {
    grid.addEventListener('dragover', function(e) {
      e.preventDefault();
      var dragging = grid.querySelector('.dragging');
      if (!dragging) return;
      var after = getDragAfter(grid, e.clientY);
      if (after) grid.insertBefore(dragging, after); else grid.appendChild(dragging);
    });
  }

  function getDragAfter(container, y) {
    return Array.from(container.querySelectorAll('.dash-widget:not(.dragging)')).reduce(function(cl, ch) {
      var b = ch.getBoundingClientRect();
      var o = y - b.top - b.height/2;
      return (o < 0 && o > cl.offset) ? {offset:o,element:ch} : cl;
    }, {offset:Number.NEGATIVE_INFINITY}).element;
  }

  window.resetDashboard = function() {
    localStorage.removeItem('dsec-dashboard-layout');
    renderDashboard();
    if (typeof showToast==='function') showToast('Dashboard reset','info');
  };

  renderDashboard();
  if (typeof feather !== 'undefined') feather.replace();

  // Reflow charts on window resize
  var resizeTimer;
  window.addEventListener('resize', function() {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function() {
      document.querySelectorAll('.apexcharts-canvas').forEach(function(c) {
        var parent = c.closest('.dash-widget-body');
        if (parent && parent.__apexChart) {
          parent.__apexChart.updateOptions({}, false, false, false);
        }
      });
    }, 250);
  });
})();
</script>
{% endblock %}
