<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | D-SECLAB</title>
  <link rel="icon" href="{{ url_for('static', filename='assets/images/favicon.png') }}" type="image/x-icon">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='assets/css/auth.css') }}">
</head>
<body class="auth-page">
  <div class="auth-card auth-card--wide">
    <div class="auth-logo">
      <img src="{{ url_for('static', filename='assets/images/logo/logo.svg') }}" alt="D-SECLAB" class="auth-logo-light">
      <img src="{{ url_for('static', filename='assets/images/logo/logo_dark.svg') }}" alt="D-SECLAB" class="auth-logo-dark">
      <h1 class="auth-logo-title">Create account</h1>
      <p class="auth-logo-subtitle">Get started with threat intelligence</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="auth-alert auth-alert--compact auth-alert-{{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    <form method="POST" action="{{ url_for('auth.register') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="auth-form-group auth-form-group--compact">
        <label class="auth-label">Username</label>
        <input type="text" name="username" value="{{ username|default('') }}" placeholder="Choose a username" required class="auth-input">
      </div>
      <div class="auth-form-group auth-form-group--compact">
        <label class="auth-label">Email</label>
        <input type="email" name="email" value="{{ email|default('') }}" placeholder="you@company.com" required class="auth-input">
      </div>
      <div class="auth-form-group auth-form-group--compact">
        <label class="auth-label">Password</label>
        <input type="password" name="password" placeholder="Min 8 chars, uppercase, lowercase, number" required class="auth-input">
      </div>
      <div class="auth-form-group auth-form-group--compact">
        <label class="auth-label">Confirm Password</label>
        <input type="password" name="confirm" placeholder="Repeat password" required class="auth-input">
      </div>
      <button type="submit" class="auth-btn">Create Account</button>
    </form>

    <div class="auth-footer">
      Already have an account? <a href="{{ url_for('auth.login') }}">Sign in</a>
    </div>
  </div>
</body>
</html>
