<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | D-SECLAB</title>
  <link rel="icon" href="{{ url_for('static', filename='assets/images/favicon.png') }}" type="image/x-icon">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Inter',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#f0f4ff 0%,#e8eeff 50%,#f5f3ff 100%);color:#0f172a;padding:20px;}
    .login-card{background:#fff;border-radius:16px;box-shadow:0 4px 24px rgba(0,0,0,0.06);padding:40px;width:100%;max-width:420px;}
    .login-logo{text-align:center;margin-bottom:28px;}
    .login-logo img{height:36px;}
    .login-logo h1{font-size:20px;font-weight:700;margin-top:12px;}
    .login-logo p{font-size:13px;color:#64748b;margin-top:4px;}
    .form-group{margin-bottom:14px;}
    .form-group label{display:block;font-size:12px;font-weight:600;color:#475569;margin-bottom:4px;}
    .form-group input{width:100%;padding:10px 12px;border:1px solid #e2e8f0;border-radius:8px;font-size:14px;font-family:'Inter',sans-serif;outline:none;transition:border-color 0.15s;}
    .form-group input:focus{border-color:#1a56db;box-shadow:0 0 0 3px rgba(26,86,219,0.08);}
    .btn-login{width:100%;padding:11px;background:#1a56db;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;font-family:'Inter',sans-serif;cursor:pointer;transition:background 0.15s;}
    .btn-login:hover{background:#1347b8;}
    .login-footer{text-align:center;margin-top:20px;font-size:13px;color:#94a3b8;}
    .login-footer a{color:#1a56db;text-decoration:none;font-weight:500;}
    .alert{padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:14px;font-weight:500;}
    .alert-danger{background:#fef2f2;color:#dc2626;}
    .alert-warning{background:#fffbeb;color:#92400e;}
    .alert-success{background:#ecfdf5;color:#059669;}
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-logo">
      <img src="{{ url_for('static', filename='assets/images/logo/logo.png') }}" alt="D-SECLAB">
      <h1>Create account</h1>
      <p>Get started with threat intelligence</p>
    </div>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="alert alert-{{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    <form method="POST" action="{{ url_for('auth.register') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label>Username</label>
        <input type="text" name="username" value="{{ username|default('') }}" placeholder="Choose a username" required>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" value="{{ email|default('') }}" placeholder="you@company.com" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" placeholder="Min 8 chars, uppercase, lowercase, number" required>
      </div>
      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" name="confirm" placeholder="Repeat password" required>
      </div>
      <button type="submit" class="btn-login">Create Account</button>
    </form>
    <div class="login-footer">
      Already have an account? <a href="{{ url_for('auth.login') }}">Sign in</a>
    </div>
  </div>
</body>
</html>
