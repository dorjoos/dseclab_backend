{% extends "base.html" %}
{% block css %}
<link rel="stylesheet" href="{{ url_for('static', filename='assets/css/pages/profile.css') }}">
{% endblock %}
{% block content %}
<div class="container-fluid p-0 setup-2fa-container">
  <div class="card setup-2fa-card">
    <div class="setup-2fa-title">Enable Two-Factor Authentication</div>
    <p class="setup-2fa-desc">Scan the QR code with your authenticator app (Google Authenticator, Authy, etc.)</p>

    <div class="setup-2fa-qr-wrapper">
      <img src="data:image/png;base64,{{ qr_b64 }}" alt="QR Code" class="setup-2fa-qr-img">
    </div>

    <div class="setup-2fa-manual-entry">
      <div class="setup-2fa-manual-label">Manual entry key</div>
      <code class="setup-2fa-secret-code">{{ secret }}</code>
    </div>

    <form method="POST" class="setup-2fa-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="setup-2fa-token-group">
        <label class="profile-form-label">Verification Code</label>
        <input type="text" name="token" class="form-control setup-2fa-token-input" placeholder="000000" maxlength="6" autocomplete="off" required autofocus>
      </div>
      <button type="submit" class="btn btn-primary setup-2fa-submit-btn">Verify & Enable</button>
    </form>

    <a href="{{ url_for('auth.profile') }}" class="setup-2fa-cancel-link">Cancel</a>
  </div>
</div>
{% endblock %}
