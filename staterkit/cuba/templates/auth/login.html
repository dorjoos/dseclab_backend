<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | D-SECLAB</title>
  <link rel="icon" href="{{ url_for('static', filename='assets/images/favicon.png') }}" type="image/x-icon">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='assets/css/auth.css') }}">
</head>
<body class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <img src="{{ url_for('static', filename='assets/images/logo/logo.svg') }}" alt="D-SECLAB" class="auth-logo-light">
      <img src="{{ url_for('static', filename='assets/images/logo/logo_dark.svg') }}" alt="D-SECLAB" class="auth-logo-dark">
      <h1 class="auth-logo-title">Welcome back</h1>
      <p class="auth-logo-subtitle">Sign in to your threat intelligence platform</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="auth-alert auth-alert-{{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="auth-form-group">
        <label class="auth-label">Email</label>
        <input type="email" name="email" value="{{ email|default('') }}" placeholder="you@company.com" required autofocus class="auth-input">
      </div>
      <div class="auth-form-group">
        <label class="auth-label">Password</label>
        <input type="password" name="password" placeholder="Enter your password" required class="auth-input">
      </div>
      <div class="auth-check">
        <input type="checkbox" name="remember" id="remember" value="1">
        <label for="remember">Remember me</label>
      </div>
      <button type="submit" class="auth-btn">Sign In</button>
    </form>

    <div class="auth-footer">
      Don't have an account? <a href="{{ url_for('auth.register') }}">Register</a>
    </div>
  </div>
</body>
</html>
