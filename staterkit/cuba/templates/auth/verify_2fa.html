<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify 2FA | D-SECLAB</title>
  <link rel="icon" href="{{ url_for('static', filename='assets/images/favicon.png') }}" type="image/x-icon">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='assets/css/auth.css') }}">
</head>
<body class="auth-page">
  <div class="auth-card auth-card--narrow auth-card--center">
    <img src="{{ url_for('static', filename='assets/images/logo/logo.svg') }}" alt="D-SECLAB" class="auth-logo-light">
    <img src="{{ url_for('static', filename='assets/images/logo/logo_dark.svg') }}" alt="D-SECLAB" class="auth-logo-dark">
    <h1>Two-Factor Authentication</h1>
    <p>Enter the 6-digit code from your authenticator app</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="auth-alert auth-alert-{{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label class="auth-label auth-label--left">Verification Code</label>
      <input type="text" name="token" placeholder="000000" maxlength="6" autocomplete="off" required autofocus class="auth-input auth-input--code">
      <button type="submit" class="auth-btn auth-btn--mt">Verify</button>
    </form>
    <a href="{{ url_for('auth.login') }}" class="auth-back">Back to login</a>
  </div>
</body>
</html>
