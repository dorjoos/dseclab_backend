{% extends "base.html" %}

{% block css %}
<link rel="stylesheet" href="{{ url_for('static', filename='assets/css/pages/breached-creds.css') }}">
{% endblock %}

{% block content %}
<div class="container-fluid p-0 av-form-container">
  <div class="card av-form-card">
    <h5 class="av-form-title">
      {% if breached_cred %}Edit Credential{% else %}Add Credential{% endif %}
    </h5>

    <form method="POST" action="{% if breached_cred %}{{ url_for('threat_intel.breached_creds_edit', doc_id=breached_cred.es_id) }}{% else %}{{ url_for('threat_intel.breached_creds_add') }}{% endif %}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="av-form-grid-2">
        <div>
          <label class="av-form-label">Username</label>
          <input type="text" name="username" value="{{ breached_cred.username if breached_cred else '' }}" class="form-control av-form-input" placeholder="user@example.com">
        </div>
        <div>
          <label class="av-form-label">Domain</label>
          <input type="text" name="domain" value="{{ breached_cred.domain if breached_cred else '' }}" class="form-control av-form-input" placeholder="example.com">
        </div>
      </div>

      <div class="av-form-group">
        <label class="av-form-label">Password</label>
        <input type="text" name="password" value="{{ breached_cred.password if breached_cred else '' }}" class="form-control av-form-input av-form-input--mono" placeholder="Breached password">
      </div>

      <div class="av-form-grid-2">
        <div>
          <label class="av-form-label">Source</label>
          <input type="text" name="source" value="{{ breached_cred.source if breached_cred else '' }}" class="form-control av-form-input" placeholder="e.g. Telegram">
        </div>
        <div>
          <label class="av-form-label">Type</label>
          <select name="type" class="form-select av-form-input">
            <option value="">Select Type</option>
            {% for t in ['combolist','stealer','malware','pastebin','breach','phishing','darkweb'] %}
            <option value="{{ t }}" {% if breached_cred and breached_cred.type == t %}selected{% endif %}>{{ t|title }}</option>
            {% endfor %}
          </select>
        </div>
      </div>

      <div class="av-form-group">
        <label class="av-form-label">URL</label>
        <input type="text" name="url" value="{{ breached_cred.url if breached_cred else '' }}" class="form-control av-form-input" placeholder="https://...">
      </div>

      <div class="av-form-grid-3">
        <div>
          <label class="av-form-label">ID</label>
          <input type="text" name="_id" value="{{ breached_cred._id if breached_cred else '' }}" class="form-control av-form-input" placeholder="Enter ID">
        </div>
        <div>
          <label class="av-form-label">Index</label>
          <input type="text" name="_index" value="{{ breached_cred._index if breached_cred else '' }}" class="form-control av-form-input" placeholder="Enter index">
        </div>
        <div>
          <label class="av-form-label">Score</label>
          <input type="number" name="_score" step="0.01" value="{{ breached_cred._score if breached_cred and breached_cred._score is not none else '' }}" class="form-control av-form-input" placeholder="Score">
        </div>
      </div>

      <div class="av-form-group--lg">
        <label class="av-form-label">Ignored</label>
        <select name="_ignored" class="form-select av-form-input av-form-select--sm">
          <option value="0" {% if not breached_cred or not breached_cred._ignored %}selected{% endif %}>No</option>
          <option value="1" {% if breached_cred and breached_cred._ignored %}selected{% endif %}>Yes</option>
        </select>
      </div>

      <div class="av-form-actions">
        <a href="{{ url_for('threat_intel.breached_creds_list') }}" class="btn btn-outline-primary btn-sm">Cancel</a>
        <button type="submit" class="btn btn-primary btn-sm">{% if breached_cred %}Update{% else %}Add{% endif %}</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
