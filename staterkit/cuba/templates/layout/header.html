<header class="dsec-header">
  <div class="dsec-header-left">
    <button class="dsec-sidebar-toggle" id="dsec-sidebar-toggle">
      <i data-feather="menu"></i>
    </button>
    <div class="dsec-header-search">
      <i data-feather="search"></i>
      <form action="{{ url_for('threat_intel.breached_creds_list') }}" method="get" class="header-search-form">
        <input type="text" name="search" placeholder="Search breached credentials..." autocomplete="off">
      </form>
    </div>
  </div>
  <div class="dsec-header-right">
    <!-- Theme toggle -->
    <button class="dsec-header-btn" id="theme-toggle" title="Toggle dark/light mode">
      <i data-feather="moon" id="theme-icon-dark"></i>
      <i data-feather="sun" id="theme-icon-light" class="d-none"></i>
    </button>

    {% if current_user.is_authenticated %}
    <div class="header-dropdown-wrapper">
      <button class="dsec-header-btn" id="notif-toggle" title="Notifications">
        <i data-feather="bell"></i>
        <span class="dsec-header-badge d-none" id="notification-badge"></span>
      </button>
      <div class="dsec-notif-dropdown" id="notif-dropdown">
        <div class="header-notif-panel-header">
          <span class="header-notif-panel-title">Notifications</span>
          <button class="btn btn-sm btn-outline-primary header-mark-all-btn d-none" id="mark-all-read-btn">Mark all read</button>
        </div>
        <ul id="notification-list" class="header-notif-list">
          <li class="header-notif-empty">No notifications</li>
        </ul>
      </div>
    </div>
    <div class="header-dropdown-wrapper">
      <div class="dsec-header-profile" id="profile-toggle">
        <div class="dsec-header-profile-info">
          <div class="dsec-header-profile-name">{{ current_user.username }}</div>
          <div class="dsec-header-profile-role">{{ 'Admin' if current_user.is_admin_user else 'Member' }}</div>
        </div>
        <i data-feather="chevron-down" class="header-chevron-icon"></i>
      </div>
      <div class="dsec-profile-dropdown" id="profile-dropdown">
        <a href="{{ url_for('auth.profile') }}"><i data-feather="user" class="header-dropdown-icon"></i> Profile</a>
        <a href="{{ url_for('auth.logout') }}"><i data-feather="log-out" class="header-dropdown-icon"></i> Logout</a>
      </div>
    </div>
    {% else %}
    <a href="{{ url_for('auth.login') }}" class="btn btn-primary btn-sm">Sign In</a>
    {% endif %}
  </div>
</header>

<script>
document.addEventListener('DOMContentLoaded', function() {
  // Theme toggle
  var themeBtn = document.getElementById('theme-toggle');
  var iconDark = document.getElementById('theme-icon-dark');
  var iconLight = document.getElementById('theme-icon-light');
  var saved = localStorage.getItem('dsec-theme');
  if (saved === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
    if (iconDark) iconDark.classList.add('d-none');
    if (iconLight) iconLight.classList.remove('d-none');
  }
  if (themeBtn) {
    themeBtn.addEventListener('click', function() {
      var current = document.documentElement.getAttribute('data-theme');
      if (current === 'dark') {
        document.documentElement.removeAttribute('data-theme');
        localStorage.setItem('dsec-theme', 'light');
        if (iconDark) { iconDark.classList.remove('d-none'); }
        if (iconLight) { iconLight.classList.add('d-none'); }
      } else {
        document.documentElement.setAttribute('data-theme', 'dark');
        localStorage.setItem('dsec-theme', 'dark');
        if (iconDark) { iconDark.classList.add('d-none'); }
        if (iconLight) { iconLight.classList.remove('d-none'); }
      }
      if (typeof feather !== 'undefined') feather.replace();
    });
  }

  // Profile dropdown toggle
  var pt = document.getElementById('profile-toggle');
  var pd = document.getElementById('profile-dropdown');
  if (pt && pd) {
    pt.addEventListener('click', function(e) {
      e.stopPropagation();
      pd.classList.toggle('show');
      var nd = document.getElementById('notif-dropdown');
      if (nd) nd.classList.remove('show');
    });
  }

  // Notification dropdown toggle
  var nt = document.getElementById('notif-toggle');
  var nd = document.getElementById('notif-dropdown');
  if (nt && nd) {
    nt.addEventListener('click', function(e) {
      e.stopPropagation();
      nd.classList.toggle('show');
      if (pd) pd.classList.remove('show');
      if (nd.classList.contains('show')) loadNotifications();
    });
  }

  // Close dropdowns on outside click
  document.addEventListener('click', function() {
    if (pd) pd.classList.remove('show');
    if (nd) nd.classList.remove('show');
  });

  // Notification loading
  function escapeHtml(t) {
    if (!t) return '';
    var d = document.createElement('div');
    d.textContent = t;
    return d.innerHTML;
  }

  function loadNotifications() {
    fetch('/api/notifications?limit=5&unread_only=1', { credentials: 'same-origin' })
      .then(function(r) { return r.json(); })
      .then(function(data) {
        var badge = document.getElementById('notification-badge');
        var list = document.getElementById('notification-list');
        var markBtn = document.getElementById('mark-all-read-btn');
        if (badge) {
          if (data.unread_count > 0) { badge.classList.remove('d-none'); } else { badge.classList.add('d-none'); }
        }
        if (!list) return;
        if (!data.notifications || !data.notifications.length) {
          list.textContent = '';
          var li = document.createElement('li');
          li.className = 'header-notif-empty';
          li.textContent = 'No notifications';
          list.appendChild(li);
          if (markBtn) markBtn.classList.add('d-none');
          return;
        }
        list.textContent = '';
        data.notifications.forEach(function(n) {
          var li = document.createElement('li');
          li.style.cssText = 'border-bottom:1px solid var(--border-light);';
          var a = document.createElement('a');
          a.href = n.link || '#';
          a.style.cssText = 'display:block;padding:10px 16px;text-decoration:none;color:var(--text);' + (n.is_read ? '' : 'background:var(--primary-50);');
          var title = document.createElement('div');
          title.style.cssText = 'font-weight:' + (n.is_read ? '400' : '600') + ';font-size:13px;';
          title.textContent = n.title || 'Notification';
          var msg = document.createElement('div');
          msg.style.cssText = 'font-size:12px;color:var(--text-muted);margin-top:2px;';
          msg.textContent = n.message || '';
          var time = document.createElement('div');
          time.style.cssText = 'font-size:11px;color:var(--text-muted);margin-top:4px;';
          time.textContent = n.time_ago || '';
          a.appendChild(title);
          a.appendChild(msg);
          a.appendChild(time);
          li.appendChild(a);
          list.appendChild(li);
        });
        if (markBtn) {
          if (data.unread_count > 0) { markBtn.classList.remove('d-none'); } else { markBtn.classList.add('d-none'); }
        }
      })
      .catch(function() {});
  }

  // Mark all read
  var markAllBtn = document.getElementById('mark-all-read-btn');
  if (markAllBtn) {
    markAllBtn.addEventListener('click', function(e) {
      e.preventDefault();
      fetch('/api/notifications/mark-all-read', { method:'POST', credentials:'same-origin', headers:{'X-CSRFToken':window.CSRF_TOKEN} })
        .then(function() { loadNotifications(); });
    });
  }

  // Initial load + polling (5 min)
  loadNotifications();
  setInterval(loadNotifications, 300000);
});
</script>
