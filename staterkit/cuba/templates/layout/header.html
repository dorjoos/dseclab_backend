<header class="dsec-header">
  <div class="dsec-header-left">
    <button class="dsec-sidebar-toggle" id="dsec-sidebar-toggle">
      <i data-feather="menu"></i>
    </button>
    <div class="dsec-header-search">
      <i data-feather="search"></i>
      <form action="{{ url_for('threat_intel.breached_creds_list') }}" method="get" style="margin:0;">
        <input type="text" name="search" placeholder="Search breached credentials..." autocomplete="off">
      </form>
    </div>
  </div>
  <div class="dsec-header-right">
    {% if current_user.is_authenticated %}
    <div style="position:relative;">
      <button class="dsec-header-btn" id="notif-toggle" title="Notifications">
        <i data-feather="bell"></i>
        <span class="dsec-header-badge" id="notification-badge" style="display:none;"></span>
      </button>
      <div class="dsec-notif-dropdown" id="notif-dropdown">
        <div style="padding:12px 16px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center;">
          <span style="font-weight:600; font-size:14px;">Notifications</span>
          <button class="btn btn-sm btn-outline-primary" id="mark-all-read-btn" style="display:none; font-size:11px; padding:2px 8px;">Mark all read</button>
        </div>
        <ul id="notification-list" style="list-style:none; padding:0; margin:0; max-height:300px; overflow-y:auto;">
          <li style="text-align:center; padding:24px; color:var(--text-muted); font-size:13px;">No notifications</li>
        </ul>
      </div>
    </div>
    <div style="position:relative;">
      <div class="dsec-header-profile" id="profile-toggle">
        <div class="dsec-header-profile-info">
          <div class="dsec-header-profile-name">{{ current_user.username }}</div>
          <div class="dsec-header-profile-role">{{ 'Admin' if current_user.is_admin_user else 'Member' }}</div>
        </div>
        <i data-feather="chevron-down" style="width:14px;height:14px;color:var(--text-muted);"></i>
      </div>
      <div class="dsec-profile-dropdown" id="profile-dropdown">
        <a href="{{ url_for('auth.profile') }}"><i data-feather="user" style="width:16px;height:16px;"></i> Profile</a>
        <a href="{{ url_for('auth.logout') }}"><i data-feather="log-out" style="width:16px;height:16px;"></i> Logout</a>
      </div>
    </div>
    {% else %}
    <a href="{{ url_for('auth.login') }}" class="btn btn-primary btn-sm">Sign In</a>
    {% endif %}
  </div>
</header>

<script>
document.addEventListener('DOMContentLoaded', function() {
  // Profile dropdown toggle
  var pt = document.getElementById('profile-toggle');
  var pd = document.getElementById('profile-dropdown');
  if (pt && pd) {
    pt.addEventListener('click', function(e) {
      e.stopPropagation();
      pd.classList.toggle('show');
      var nd = document.getElementById('notif-dropdown');
      if (nd) nd.classList.remove('show');
    });
  }

  // Notification dropdown toggle
  var nt = document.getElementById('notif-toggle');
  var nd = document.getElementById('notif-dropdown');
  if (nt && nd) {
    nt.addEventListener('click', function(e) {
      e.stopPropagation();
      nd.classList.toggle('show');
      if (pd) pd.classList.remove('show');
      if (nd.classList.contains('show')) loadNotifications();
    });
  }

  // Close dropdowns on outside click
  document.addEventListener('click', function() {
    if (pd) pd.classList.remove('show');
    if (nd) nd.classList.remove('show');
  });

  // Notification loading
  function escapeHtml(t) {
    if (!t) return '';
    var d = document.createElement('div');
    d.textContent = t;
    return d.innerHTML;
  }

  function loadNotifications() {
    fetch('/api/notifications?limit=5&unread_only=1', { credentials: 'same-origin' })
      .then(function(r) { return r.json(); })
      .then(function(data) {
        var badge = document.getElementById('notification-badge');
        var list = document.getElementById('notification-list');
        var markBtn = document.getElementById('mark-all-read-btn');
        if (badge) badge.style.display = data.unread_count > 0 ? 'block' : 'none';
        if (!list) return;
        if (!data.notifications || !data.notifications.length) {
          list.textContent = '';
          var li = document.createElement('li');
          li.style.cssText = 'text-align:center;padding:24px;color:var(--text-muted);font-size:13px;';
          li.textContent = 'No notifications';
          list.appendChild(li);
          if (markBtn) markBtn.style.display = 'none';
          return;
        }
        list.textContent = '';
        data.notifications.forEach(function(n) {
          var li = document.createElement('li');
          li.style.cssText = 'border-bottom:1px solid var(--border-light);';
          var a = document.createElement('a');
          a.href = n.link || '#';
          a.style.cssText = 'display:block;padding:10px 16px;text-decoration:none;color:var(--text);' + (n.is_read ? '' : 'background:var(--primary-50);');
          var title = document.createElement('div');
          title.style.cssText = 'font-weight:' + (n.is_read ? '400' : '600') + ';font-size:13px;';
          title.textContent = n.title || 'Notification';
          var msg = document.createElement('div');
          msg.style.cssText = 'font-size:12px;color:var(--text-muted);margin-top:2px;';
          msg.textContent = n.message || '';
          var time = document.createElement('div');
          time.style.cssText = 'font-size:11px;color:var(--text-muted);margin-top:4px;';
          time.textContent = n.time_ago || '';
          a.appendChild(title);
          a.appendChild(msg);
          a.appendChild(time);
          li.appendChild(a);
          list.appendChild(li);
        });
        if (markBtn) markBtn.style.display = data.unread_count > 0 ? 'inline-block' : 'none';
      })
      .catch(function() {});
  }

  // Mark all read
  var markAllBtn = document.getElementById('mark-all-read-btn');
  if (markAllBtn) {
    markAllBtn.addEventListener('click', function(e) {
      e.preventDefault();
      fetch('/api/notifications/mark-all-read', { method:'POST', credentials:'same-origin', headers:{'X-CSRFToken':window.CSRF_TOKEN} })
        .then(function() { loadNotifications(); });
    });
  }

  // Initial load + polling
  loadNotifications();
  setInterval(loadNotifications, 60000);
});
</script>
