<aside class="dsec-sidebar" id="dsec-sidebar">
  <div class="dsec-sidebar-logo">
    <a href="{{ url_for('main.indexPage') }}" class="sidebar-logo-link">
      <img src="{{ url_for('static', filename='assets/images/logo/logo.svg') }}" alt="D-SECLAB" class="dsec-logo-light">
      <img src="{{ url_for('static', filename='assets/images/logo/logo_dark.svg') }}" alt="D-SECLAB" class="dsec-logo-dark">
    </a>
  </div>
  <nav class="dsec-sidebar-nav">
    <div class="dsec-nav-section">
      <a href="{{ url_for('main.indexPage') }}" class="dsec-nav-item {% if request.endpoint == 'main.indexPage' %}active{% endif %}">
        <i data-feather="home"></i> Dashboard
      </a>
    </div>

    <div class="dsec-nav-section">
      <p class="dsec-nav-section-title">Threat Intelligence</p>
      <a href="{{ url_for('threat_intel.breached_creds_list') }}" class="dsec-nav-item {% if 'breached_creds' in (request.endpoint or '') %}active{% endif %}">
        <i data-feather="shield"></i> Breached Credentials
      </a>
      <a href="{{ url_for('vulnerabilities.list_page') }}" class="dsec-nav-item {% if 'vulnerabilities' in (request.endpoint or '') %}active{% endif %}">
        <i data-feather="alert-triangle"></i> Vulnerabilities
      </a>
      <a href="{{ url_for('threat_intel.analysis') }}" class="dsec-nav-item {% if request.endpoint == 'threat_intel.analysis' %}active{% endif %}">
        <i data-feather="bar-chart-2"></i> Analysis
      </a>
      <a href="{{ url_for('threat_intel.reports') }}" class="dsec-nav-item {% if request.endpoint == 'threat_intel.reports' %}active{% endif %}">
        <i data-feather="file-text"></i> Reports
      </a>
      <a href="{{ url_for('threat_intel.breach_summary') }}" class="dsec-nav-item {% if request.endpoint == 'threat_intel.breach_summary' %}active{% endif %}">
        <i data-feather="file-text"></i> Executive Summary
      </a>
      <a href="{{ url_for('threat_intel.ransomware_dashboard') }}" class="dsec-nav-item {% if request.endpoint == 'threat_intel.ransomware_dashboard' %}active{% endif %}">
        <i data-feather="lock"></i> Ransomware
      </a>
    </div>

    {% if current_user.is_authenticated and current_user.is_admin_user %}
    <div class="dsec-nav-section">
      <p class="dsec-nav-section-title">Administration</p>
      <a href="{{ url_for('admin.user_management') }}" class="dsec-nav-item {% if 'user' in (request.endpoint or '') and 'admin' in (request.endpoint or '') %}active{% endif %}">
        <i data-feather="users"></i> Users
      </a>
      <a href="{{ url_for('admin.company_management') }}" class="dsec-nav-item {% if 'company' in (request.endpoint or '') %}active{% endif %}">
        <i data-feather="briefcase"></i> Companies
      </a>
      <a href="{{ url_for('admin.audit_logs') }}" class="dsec-nav-item {% if request.endpoint == 'admin.audit_logs' %}active{% endif %}">
        <i data-feather="activity"></i> Audit Logs
      </a>
      <a href="{{ url_for('admin.user_activities') }}" class="dsec-nav-item {% if request.endpoint == 'admin.user_activities' %}active{% endif %}">
        <i data-feather="clock"></i> User Activity
      </a>
      <a href="{{ url_for('admin.compliance_dashboard') }}" class="dsec-nav-item {% if request.endpoint == 'admin.compliance_dashboard' %}active{% endif %}">
        <i data-feather="check-square"></i> Compliance
      </a>
    </div>
    {% endif %}

    <div class="dsec-nav-section sidebar-bottom-section">
      <a href="/api/docs/" class="dsec-nav-item" target="_blank">
        <i data-feather="book-open"></i> API Docs
      </a>
      <a href="{{ url_for('auth.profile') }}" class="dsec-nav-item {% if request.endpoint == 'auth.profile' %}active{% endif %}">
        <i data-feather="settings"></i> Settings
      </a>
    </div>
  </nav>
</aside>
