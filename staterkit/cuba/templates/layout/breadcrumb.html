{% if breadcrumb %}
<div class="breadcrumb-inline">
  <a href="{{ url_for('main.indexPage') }}" class="breadcrumb-inline-link">Home</a>
  {% if breadcrumb.parent %}
  <span class="breadcrumb-inline-sep">/</span>
  <span>{{ breadcrumb.parent }}</span>
  {% endif %}
  {% if breadcrumb.child %}
  <span class="breadcrumb-inline-sep">/</span>
  <span class="breadcrumb-inline-current">{{ breadcrumb.child }}</span>
  {% endif %}
</div>
{% endif %}
