name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: staterkit

    strategy:
      fail-fast: false
      matrix:
        # 3.10 is what developers run locally, 3.12 is what production runs on
        # Ubuntu 24.04. Version-specific breakage has cost us a deploy before,
        # so both are checked.
        python-version: ['3.10', '3.12']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: staterkit/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          # No Elasticsearch here: the fixtures replace the service, so the
          # suite passes without one. Pointing at a dead port stops the client
          # spending the run on connection retries.
          ELASTICSEARCH_URL: http://127.0.0.1:59999
          ELASTICSEARCH_PASSWORD: ci
        # `python -m` puts the working directory on sys.path, so `import cuba`
        # resolves without depending on pytest's rootdir inference.
        run: python -m pytest -q

  lint:
    # Separate job, not another matrix leg: ruff and mypy are Python-version
    # agnostic here and running them twice only doubles the wait for the same
    # answer. Not `needs: pytest` either — a lint failure and a test failure
    # are independent signals and you want both on the first push.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: staterkit

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: staterkit/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: ruff
        run: ruff check --output-format=github .

      - name: mypy
        # Lenient by default, strict per-module. The override list in
        # pyproject.toml is a ratchet: type a module, add it, and it can never
        # silently regress.
        run: mypy
